# Local deployment. Three services, each independently buildable so an organisation can
# take any one of them and run it their own way.
#
# Model access is entirely OpenAI-compatible: the backend knows only GATEWAY_BASE_URL and
# GATEWAY_API_KEY. Point those at a work LiteLLM instance, a vLLM server, or api.openai.com
# and nothing else changes.

name: ai-security-governance

services:
  # The single OpenAI-compatible surface every compute engine talks to.
  # Separate image because litellm[proxy] cannot share a venv with inspect-ai.
  gateway:
    build: ./gateway
    # 4001 on the host: LiteLLM's conventional 4000 is often already taken by another
    # project's gateway, and silently colliding with one is worse than a neighbouring port.
    ports:
      # Bound to loopback. The gateway has no authentication beyond a shared bearer token,
      # and this is a single-user local tool, so it has no business listening on the LAN.
      - "127.0.0.1:4001:4000"
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-sk-local}
      # Real upstream keys, read from ./.env. Absent keys are fine — the mock models and
      # local Ollama routes need none, so a clean checkout still boots and passes preflight.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Host Ollama by default. Colima maps host.docker.internal to the host.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/readiness',timeout=5).status==200 else 1)",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GATEWAY_BASE_URL: http://gateway:4000/v1
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-sk-local}
      # Default judge is a LOCAL Ollama model so development and the whole end-to-end
      # test suite cost nothing. gpt-5.6-luna is the intended judge for real calibration
      # runs (Phase 5) — set DEFAULT_JUDGE_MODEL in .env when you want it, and note that
      # it currently needs credits added to the OpenAI account.
      DEFAULT_JUDGE_MODEL: ${DEFAULT_JUDGE_MODEL:-qwen35}
      APP_DATA_DIR: /srv/data
    volumes:
      # SQLite DB, eval logs, scanner reports, per-run clone workspaces.
      - appdata:/srv/data
    depends_on:
      gateway:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend

  # Optional: run Ollama in-cluster instead of on the host. Use when Colima's
  # host.docker.internal mapping misbehaves.
  #   docker compose --profile local-models up
  # Models must be pulled into the volume once:
  #   docker compose exec ollama ollama pull gemma4
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-models"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  appdata:
  ollama-models:
